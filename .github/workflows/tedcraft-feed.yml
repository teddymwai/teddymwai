name: Refresh TedCraft Feed

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest TedCraft RSS items
        run: |
          python3 tools/profile_builder/build.py --feed
          python3 tools/profile_builder/build.py --selftest

      - name: Commit updated feed if changed
        run: |
          if git diff --quiet README.md; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(feed): refresh TedCraft dispatches"
          git push
