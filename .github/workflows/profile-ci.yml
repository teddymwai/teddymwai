name: Profile CI

on:
  push:
    branches: [main, staging, "beta/**"]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python3 -m compileall -q tools

      - name: Run profile builder selftest
        run: python3 tools/profile_builder/build.py --selftest

      - name: Verify generated README and SVGs are in sync
        run: python3 tools/profile_builder/build.py --check

      - name: Run unit tests
        run: python3 -m unittest discover -s tools/profile_builder -v

      - name: Validate SVG XML well-formedness
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout assets/brand/*.svg assets/cards/*.svg

      - name: Secret hygiene scan
        run: |
          if grep -rnE '(glpat-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' data assets tools README.md; then
            echo "Potential secret detected"
            exit 1
          fi
