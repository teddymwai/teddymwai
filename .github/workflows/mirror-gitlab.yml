name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["Lagopus*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Sync working tree to SHA-256 GitLab repository
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        run: |
          if [ -z "$GITLAB_PUSH_TOKEN" ]; then
            echo "GITLAB_PUSH_TOKEN secret is not configured; skipping GitLab mirror."
            exit 0
          fi
          git clone "https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/teddymwai/teddymwai.git" /tmp/gitlab-mirror
          rsync -a --delete --exclude='.git' ./ /tmp/gitlab-mirror/
          cd /tmp/gitlab-mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(mirror): sync from github.com/teddymwai/teddymwai (${GITHUB_SHA::7})"
            git push origin main
          fi
          if [[ "${GITHUB_REF}" == refs/tags/Lagopus* ]]; then
            git tag -f "${GITHUB_REF_NAME}" -m "Mirrored from GitHub ${GITHUB_REF_NAME}"
            git push origin "refs/tags/${GITHUB_REF_NAME}"
          fi
