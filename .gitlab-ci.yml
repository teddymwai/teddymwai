stages:
  - verify

profile-ci:
  stage: verify
  image: python:3.11-slim
  script:
    - python3 -m compileall -q tools
    - python3 tools/profile_builder/build.py --selftest
    - python3 tools/profile_builder/build.py --check
    - python3 -m unittest discover -s tools/profile_builder -v
    - |
      if grep -rnE '(glpat-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' data assets tools README.md; then
        echo "Potential secret detected"
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
